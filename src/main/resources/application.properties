spring.application.name=rau-java-test
spring.datasource.url=jdbc:h2:file:./data/subscriptions;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
onno.schema.mode=apply
onno.ui.locale=ru
onno.auth.mode=in-memory
onno.auth.users[0].username=admin
onno.auth.users[0].password=admin
onno.auth.users[0].roles[0]=ADMIN
onno.auth.users[1].username=manager
onno.auth.users[1].password=manager
onno.auth.users[1].roles[0]=MANAGER
server.error.include-message=always
onno.auth.session.remember-me.allow-ephemeral-key=true
